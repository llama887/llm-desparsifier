[project]
name = "llm-desparsifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0.3",
    "jax[cuda12]>=0.7.2",
    "pytest>=8.4.2",
    "xminigrid[baselines]>=0.9.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_desparsifier*"]
