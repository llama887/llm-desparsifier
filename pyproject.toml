[project]
name = "llm-desparsifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0.3",
    "imageio>=2.34.1",
    "imageio-ffmpeg>=0.5.1",
    "jax[cuda12]>=0.7.2",
    "Pillow>=10.3.0",
    "pytest>=8.4.2",
    "xminigrid[baselines]>=0.9.1",
    "pyyaml>=6.0.2",
    "wandb>=0.22.1",
    "weave>=0.52.22",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_desparsifier*"]
